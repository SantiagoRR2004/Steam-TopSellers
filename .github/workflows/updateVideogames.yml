name: Update videogames.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs at midnight (12:00 AM) every day

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.12" # Latest stable version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas tqdm

      - name: Run dataAcquisition.py
        run: python dataAcquisition.py

      - name: Commit and push changes
        run: |
          git config --local user.email "90837+bgilmore@users.noreply.github.com"
          git config --local user.name "bgilmore"
          if ! git diff --quiet; then
            git add .
            git commit \
              -m "chore: Update videogames.json [GitHub Action]" \
              -m "Co-authored-by: casieber <5363253+casieber@users.noreply.github.com>" \
              -m "Co-authored-by: charleslvalve <55813982+charleslvalve@users.noreply.github.com>" \
              -m "Co-authored-by: danieljennings <582974+danieljennings@users.noreply.github.com>" \
              -m "Co-authored-by: kisak-valve <24358216+kisak-valve@users.noreply.github.com>" \
              -m "Co-authored-by: mikela-valve <49570952+mikela-valve@users.noreply.github.com>" \
              -m "Co-authored-by: MrSchism <3085862+MrSchism@users.noreply.github.com>" \
              -m "Co-authored-by: Nephyrin <965090+Nephyrin@users.noreply.github.com>" \
              -m "Co-authored-by: Plagman <529930+Plagman@users.noreply.github.com>" \
              -m "Co-authored-by: SantiagoRR2004 <114857078+SantiagoRR2004@users.noreply.github.com>" \
              -m "Co-authored-by: GitHub Action <action@github.com>"
            git push
          else
            echo "No changes to push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
